<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <title>Iniciar Sesión - GameFinder</title>
</head>
<body class="fondo-registro">

    <nav class="navbar-registro">
        <div class="nav-logo">
            <a href="{{ url_for('inicio') }}">
                <img src="{{ url_for('static', path='img/logo.png') }}" alt="GameFinder" style="height: 50px; width: auto;">
            </a>
        </div>
        <a href="{{ url_for('inicio') }}" class="btn-volver">Volver al inicio</a>
    </nav>

    <main class="contenedor-registro">
        <div class="tarjeta-registro">
            <h2>INICIAR SESIÓN</h2>

            {% if error %}
                <div style="background:#71343a; padding:10px; border-radius:6px; margin-bottom:15px;">{{ error }}</div>
            {% endif %}

            {% for mensaje in mensajes %}
                <div style="background:#20384b; border:1px solid #36617e; padding:10px; border-radius:6px; margin-bottom:15px;">{{ mensaje }}</div>
            {% endfor %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="grupo-input">
                    <label for="correo">Dirección de correo electrónico</label>
                    <input type="email" id="correo" name="correo" value="{{ form_data.get('correo', '') }}" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-registrar">Iniciar Sesión</button>
            </form>

            <div class="enlace-login">
                <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Crear Cuenta</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <p>&copy; 2026 GameFinder. Todos los derechos reservados.</p>
        </div>
    </footer>
