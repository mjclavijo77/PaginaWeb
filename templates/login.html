<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Iniciar Sesión</title>
</head>
<body class="fondo-registro">

    <nav class="navbar-registro">
        <div class="nav-logo">
            <a href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Mando" style="height: 50px; width: auto;">
            </a>
        </div>
        <a href="/" class="btn-volver">Volver al inicio</a>
    </nav>

    <main class="contenedor-registro">
        <div class="tarjeta-registro">
            <h2>INICIAR SESIÓN</h2>
            
            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

               
                <div class="enlace-login" style="margin-bottom: 25px; margin-top: -10px;">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-registrar">Iniciar Sesión</button>
            </form>

            
            <div class="enlace-login">
                <p>¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <p>&copy; 2026 GameFinder. Todos los derechos reservados.</p>
            <div class="footer-enlaces">
                <a href="#">Términos de Servicio</a>
                <a href="#">Política de Privacidad</a>
                <a href="#">Acerca de Nosotros</a>
            </div>
        </div>
    </footer>

</body>
</html>
