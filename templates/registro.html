<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Registro</title>
</head>
<body class="fondo-registro">

    <nav class="navbar-registro">
        <!-- Reemplazamos el texto por el logo con enlace al inicio -->
        <div class="nav-logo">
            <a href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Mando" style="height: 50px; width: auto;">
            </a>
        </div>
        <!-- Reemplazamos el cuadro vacío por un botón de volver -->
        <a href="/" class="btn-volver">Volver al inicio</a>
    </nav>

    <main class="contenedor-registro">
        <div class="tarjeta-registro">
            <h2>Registrarse</h2>
            
            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="usuario">Nombre de Usuario</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
                
                <div class="grupo-input">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="grupo-input">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                
                <!-- Le damos texto real al botón -->
                <button type="submit" class="btn-registrar">Crear Cuenta</button>
            </form>

            <div class="enlace-login">
                <p>¿Ya tienes cuenta?</p>
                <a href="#">Iniciar Sesion</a>
            </div>
        </div>
    </main>

</body>
</html>
