
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>GameFinder</title>
</head>

<body>

    <nav class="navbar">

        <div class="nav-logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo GameFinder">
        </div>

        <div class="nav-menu">

            <a href="{{ url_for('favoritos') }}">Favoritos</a>
            <a href="#">Biblioteca</a>

            <div class="dropdown">
                {% if usuario %}
                    <a href="#" class="btn-cuenta">{{ usuario }}</a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('logout') }}">Cerrar sesión</a>
                    </div>
                {% else %}
                    <a href="#" class="btn-cuenta">Cuenta</a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('login') }}">Iniciar Sesión</a>
                        <a href="{{ url_for('registro') }}">Crear Cuenta</a>
                    </div>
                {% endif %}
            </div>

            <div class="icono-menu">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </nav>

    <main class="busqueda">

        <h1>¿Qué videojuego estás buscando?</h1>

        <p>
            Consulta información de tu juego en un solo lugar.
        </p>

        <div class="contenedor-busqueda">

            <div class="barra-busqueda">

                <svg class="icono-lupa"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

                </svg>

                <input
                    type="text"
                    placeholder="Buscar videojuego..."
                    id="input-busqueda"
                    autocomplete="off"
                >

            </div>

            <button type="button" id="boton-buscar">
                Buscar
            </button>

        </div>

        <div id="resultados-busqueda" class="contenedor-resultados"></div>

    </main>

    <script>
        const inputBusqueda = document.getElementById('input-busqueda');
        const contenedorResultados = document.getElementById('resultados-busqueda');
        const botonBuscar = document.getElementById('boton-buscar');

        function buscarVideojuego() {
            const query = inputBusqueda.value.trim();

            if (query.length > 0) {
                window.location.href =
                    `/resultados?q=${encodeURIComponent(query)}`;
            }
        }

        botonBuscar.addEventListener('click', buscarVideojuego);

        inputBusqueda.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                buscarVideojuego();
            }
        });

        inputBusqueda.addEventListener('input', async function() {
            const query = this.value.trim();

            if (query.length === 0) {
                contenedorResultados.style.display = 'none';
                contenedorResultados.innerHTML = '';
                return;
            }

            try {
                const respuesta = await fetch(
                    `/api/buscar?q=${encodeURIComponent(query)}`
                );

                if (!respuesta.ok) {
                    throw new Error('No se pudieron cargar las sugerencias.');
                }

                const juegos = await respuesta.json();

                contenedorResultados.innerHTML = '';

                if (juegos.length > 0) {
                    juegos.forEach(juego => {
                        const opcion = document.createElement('div');

                        opcion.className = 'resultado-sugerencia';
                        opcion.textContent = juego.nombre;

                        opcion.addEventListener('click', function() {
                            inputBusqueda.value = juego.nombre;
                            buscarVideojuego();
                        });

                        contenedorResultados.appendChild(opcion);
                    });

                    contenedorResultados.style.display = 'block';
                } else {
                    contenedorResultados.style.display = 'none';
                }

            } catch (error) {
                console.error('Error en sugerencias:', error);
                contenedorResultados.style.display = 'none';
            }
        });

        document.addEventListener('click', function(event) {
            if (
                !inputBusqueda.contains(event.target) &&
                !contenedorResultados.contains(event.target)
            ) {
                contenedorResultados.style.display = 'none';
            }
        });
    </script>

</body>
</html>
