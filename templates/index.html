
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>GameFinder</title>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="{{ url_for('inicio') }}">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo GameFinder">
            </a>
        </div>

        <div class="nav-menu">
            <a href="{{ url_for('favoritos') }}">Favoritos</a>
            <a href="#">Biblioteca</a>

            <div class="dropdown">
                {% if usuario %}
                    <a href="#" class="btn-cuenta">{{ usuario }}</a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('logout') }}">Cerrar sesión</a>
                    </div>
                {% else %}
                    <a href="#" class="btn-cuenta">Cuenta</a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('login') }}">Iniciar Sesión</a>
                        <a href="{{ url_for('registro') }}">Crear Cuenta</a>
                    </div>
                {% endif %}
            </div>

            <div class="icono-menu" aria-label="Menú">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="busqueda">
        <h1>¿Qué videojuego estás buscando?</h1>
        <p>Consulta información de tu juego en un solo lugar.</p>

        <div class="zona-buscador">
            <div class="contenedor-busqueda">
                <div class="barra-busqueda">
                    <svg class="icono-lupa"
                         xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>

                    <input
                        type="text"
                        placeholder="Buscar videojuego..."
                        id="input-busqueda"
                        autocomplete="off"
                    >
                </div>

                <button type="button" id="boton-buscar">Buscar</button>
            </div>

            <div id="resultados-busqueda" class="contenedor-resultados"></div>
        </div>
    </main>

    <script>
        const inputBusqueda = document.getElementById('input-busqueda');
        const contenedorResultados = document.getElementById('resultados-busqueda');
        const botonBuscar = document.getElementById('boton-buscar');

        let timerBusqueda = null;
        let controladorFetch = null;

        function buscarVideojuego(nombreOpcional) {
            const query = (nombreOpcional || inputBusqueda.value).trim();

            if (query) {
                window.location.href = `/resultados?q=${encodeURIComponent(query)}`;
            }
        }

        function ocultarSugerencias() {
            contenedorResultados.style.display = 'none';
            contenedorResultados.innerHTML = '';
        }

        function mostrarEstado(mensaje) {
            contenedorResultados.textContent = mensaje;
            contenedorResultados.classList.add('visible');
            contenedorResultados.style.display = 'block';
        }

        botonBuscar.addEventListener('click', () => buscarVideojuego());

        inputBusqueda.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                buscarVideojuego();
            }

            if (event.key === 'Escape') {
                ocultarSugerencias();
            }
        });

        inputBusqueda.addEventListener('input', function () {
            const query = this.value.trim();

            clearTimeout(timerBusqueda);

            if (controladorFetch) {
                controladorFetch.abort();
            }

            if (query.length < 2) {
                ocultarSugerencias();
                return;
            }

            timerBusqueda = setTimeout(async () => {
                controladorFetch = new AbortController();

                mostrarEstado('Buscando videojuegos...');

                try {
                    const response = await fetch(
                        `/api/buscar?q=${encodeURIComponent(query)}&limite=6`,
                        { signal: controladorFetch.signal }
                    );

                    if (!response.ok) {
                        throw new Error('Error al consultar sugerencias.');
                    }

                    const juegos = await response.json();

                    contenedorResultados.innerHTML = '';

                    if (!Array.isArray(juegos) || juegos.length === 0) {
                        mostrarEstado('No se encontraron juegos.');
                        return;
                    }

                    juegos.forEach(juego => {
                        const opcion = document.createElement('div');
                        opcion.className = 'item-resultado';

                        const izquierda = document.createElement('div');
                        izquierda.className = 'item-izq';

                        if (juego.imagen) {
                            const imagen = document.createElement('img');
                            imagen.className = 'item-miniatura';
                            imagen.src = juego.imagen;
                            imagen.alt = '';
                            izquierda.appendChild(imagen);
                        } else {
                            const sinImagen = document.createElement('div');
                            sinImagen.className = 'item-miniatura item-sin-img';
                            sinImagen.textContent = '🎮';
                            izquierda.appendChild(sinImagen);
                        }

                        const nombre = document.createElement('span');
                        nombre.className = 'item-nombre';
                        nombre.textContent = juego.nombre || 'Videojuego';

                        if (juego.anio) {
                            const anio = document.createElement('small');
                            anio.textContent = ` (${juego.anio})`;
                            nombre.appendChild(anio);
                        }

                        izquierda.appendChild(nombre);
                        opcion.appendChild(izquierda);

                        const genero = document.createElement('span');
                        genero.className = 'item-genero';
                        genero.textContent = juego.genero || 'Videojuego';

                        opcion.appendChild(genero);

                        opcion.addEventListener('click', () => {
                            inputBusqueda.value = juego.nombre;
                            buscarVideojuego(juego.nombre);
                        });

                        contenedorResultados.appendChild(opcion);
                    });

                    contenedorResultados.style.display = 'block';

                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error('Error al buscar videojuegos:', error);
                        mostrarEstado('No fue posible cargar las sugerencias.');
                    }
                }
            }, 300);
        });

        document.addEventListener('click', event => {
            if (!event.target.closest('.zona-buscador')) {
                ocultarSugerencias();
            }
        });
    </script>

</body>
</html>
