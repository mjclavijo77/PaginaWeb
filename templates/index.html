<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>GameFinder</title>
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Mando">
        </div>

        <div class="nav-menu">
            <a href="#">Favoritos</a>
            <a href="#">Biblioteca</a>

            <div class="dropdown">
                <a href="#" class="btn-cuenta">Cuenta</a>
                <div class="dropdown-content">
                    <a href="{{ url_for('login') }}">Iniciar Sesión</a>
                    <a href="{{ url_for('registro') }}">Crear Cuenta</a>
                </div>
            </div>

            <div class="icono-menu">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="busqueda">

        <h1>¿Que videojuego estas buscando?</h1>

        <p>
            Consulta informacion de tu juego en un solo lugar.
        </p>

        <div class="zona-buscador">

            <div class="contenedor-busqueda">

                <div class="barra-busqueda">
                    <svg class="icono-lupa"
                         xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>

                    <input
                        type="text"
                        placeholder="Buscar"
                        id="input-busqueda"
                        autocomplete="off"
                    >
                </div>

                <button type="button" id="boton-buscar">
                    Buscar
                </button>

            </div>

            <div id="resultados-busqueda" class="contenedor-resultados"></div>

        </div>

    </main>

    <script>
        const inputBusqueda = document.getElementById('input-busqueda');
        const contenedorResultados = document.getElementById('resultados-busqueda');
        const botonBuscar = document.getElementById('boton-buscar');

        let timerBusqueda = null;
        let controladorFetch = null;

        function buscarVideojuego(nombreOpcional) {
            const query = (nombreOpcional || inputBusqueda.value).trim();

            if (query.length > 0) {
                window.location.href = `/resultados?q=${encodeURIComponent(query)}`;
            }
        }

        function ocultarSugerencias() {
            contenedorResultados.style.display = 'none';
            contenedorResultados.innerHTML = '';
        }

        botonBuscar.addEventListener('click', () => buscarVideojuego());

        inputBusqueda.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                buscarVideojuego();
            } else if (event.key === 'Escape') {
                ocultarSugerencias();
            }
        });

        inputBusqueda.addEventListener('input', function() {
            const query = this.value.trim();
            clearTimeout(timerBusqueda);

            if (query.length < 2) {
                ocultarSugerencias();
                return;
            }

            timerBusqueda = setTimeout(() => {
                if (controladorFetch) {
                    controladorFetch.abort();
                }
                controladorFetch = new AbortController();

                contenedorResultados.style.display = 'block';
                contenedorResultados.innerHTML =
                    '<div class="item-resultado item-estado">Buscando videojuegos...</div>';

                fetch(`/api/buscar?q=${encodeURIComponent(query)}&limite=6`, {
                    signal: controladorFetch.signal
                })
                    .then(response => response.json())
                    .then(data => {
                        contenedorResultados.innerHTML = '';

                        if (Array.isArray(data) && data.length > 0) {
                            contenedorResultados.style.display = 'block';

                            data.forEach(juego => {
                                const div = document.createElement('div');
                                div.className = 'item-resultado';

                                const imgHtml = juego.imagen
                                    ? `<img src="${juego.imagen}" alt="" class="item-miniatura">`
                                    : `<div class="item-miniatura item-sin-img">🎮</div>`;

                                const subtitulo = juego.anio ? ` (${juego.anio})` : '';

                                div.innerHTML = `
                                    <div class="item-izq">
                                        ${imgHtml}
                                        <span class="item-nombre">${juego.nombre}<small>${subtitulo}</small></span>
                                    </div>
                                    <span class="item-genero">${juego.genero}</span>
                                `;

                                div.addEventListener('click', function() {
                                    inputBusqueda.value = juego.nombre;
                                    buscarVideojuego(juego.nombre);
                                });

                                contenedorResultados.appendChild(div);
                            });
                        } else {
                            contenedorResultados.style.display = 'block';
                            contenedorResultados.innerHTML =
                                '<div class="item-resultado item-estado">No se encontraron juegos.</div>';
                        }
                    })
                    .catch(error => {
                        if (error.name !== 'AbortError') {
                            console.error('Error al buscar videojuegos:', error);
                        }
                    });
            }, 300);
        });

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.zona-buscador')) {
                ocultarSugerencias();
            }
        });
    </script>

    <footer class="footer">
        <div class="footer-contenido">
            <p>&copy; 2026 GameFinder. Todos los derechos reservados.</p>

            <div class="footer-enlaces">
                <a href="#">Términos de Servicio</a>
                <a href="#">Política de Privacidad</a>
                <a href="#">Acerca de Nosotros</a>
            </div>
        </div>
    </footer>

</body>

</html>
